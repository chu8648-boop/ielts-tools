<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思精選字彙</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+TC:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0ede6;
  --surface: #fffdf8;
  --border: #ddd6c8;
  --accent: #1a3a5c;
  --accent2: #c0392b;
  --text: #1a1a1a;
  --muted: #7a7060;
  --green: #2d7a4f;
  --red: #c0392b;
  --uk: #2c5f8a;
  --us: #c07a20;
  --unfav: #e6a817;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; overflow-x: hidden; }

.nav { display: flex; background: var(--accent); }
.nav-btn { flex: 1; padding: 0.9rem 0.5rem; background: none; border: none; color: rgba(255,255,255,0.55); font-family: 'DM Mono', monospace; font-size: 0.72rem; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; transition: all 0.15s; border-bottom: 2px solid transparent; }
.nav-btn.active { color: white; border-bottom-color: #e8d5a3; }

.page { display: none; padding: 1rem; max-width: 680px; margin: 0 auto; }
.page.active { display: block; }

.section-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }

.topic-grid { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.8rem; }
.topic-btn { padding: 0.35rem 0.75rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 0.68rem; cursor: pointer; transition: all 0.15s; color: var(--muted); white-space: nowrap; }
.topic-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

.quick-btns { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.quick-btn { padding: 0.3rem 0.7rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 0.68rem; cursor: pointer; color: var(--muted); transition: all 0.15s; }
.quick-btn:hover { border-color: var(--accent); color: var(--accent); }

.autoplay-row { display: flex; align-items: center; gap: 0.6rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 0.7rem 1rem; margin-bottom: 1rem; }
.autoplay-label { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); flex: 1; }
.accent-toggle { display: flex; gap: 0.3rem; }
.accent-btn { padding: 0.3rem 0.8rem; border-radius: 20px; border: 1.5px solid var(--border); background: none; font-family: 'DM Mono', monospace; font-size: 0.68rem; cursor: pointer; transition: all 0.15s; }
.accent-btn.uk { color: var(--uk); }
.accent-btn.us { color: var(--us); }
.accent-btn.active.uk { background: var(--uk); border-color: var(--uk); color: white; }
.accent-btn.active.us { background: var(--us); border-color: var(--us); color: white; }

.kbd-hint { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; padding: 0.4rem 0.8rem; margin-bottom: 0.8rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.kbd-hint span { white-space: nowrap; }

.stats-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.stat-box { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 0.5rem; text-align: center; }
.stat-box .val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.2rem; }
.stat-box .lbl { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); text-transform: uppercase; }
.val.green { color: var(--green); }
.val.unfav-col { color: var(--unfav); }

.swipe-hints { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
.swipe-hint { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); }
.swipe-hint.left { color: var(--unfav); }
.swipe-hint.right { color: var(--green); }

.face-dots { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 0.6rem; }
.face-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
.face-dot.active { background: var(--accent); }

.card-area { position: relative; min-height: 300px; margin-bottom: 0.8rem; user-select: none; }

.flashcard {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 2rem 1.5rem 1.5rem;
  min-height: 280px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  position: relative;
  touch-action: pan-y;
  transition: transform 0.18s, opacity 0.18s;
  cursor: pointer;
}
.flashcard.swiping { transition: none; }
.flashcard.swipe-left { transform: translateX(-120%) rotate(-8deg); opacity: 0; }
.flashcard.swipe-right { transform: translateX(120%) rotate(8deg); opacity: 0; }

.face-badge { position: absolute; top: 1rem; left: 1rem; font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.progress-badge { position: absolute; top: 1rem; right: 1rem; font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); }
.topic-badge { position: absolute; bottom: 1rem; right: 1rem; font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 0.15rem 0.5rem; }

.word-main { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2.2rem; color: var(--accent); letter-spacing: -0.01em; margin-bottom: 0.8rem; line-height: 1.1; }
.word-pos { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
.word-trans { font-size: 1.2rem; font-weight: 500; color: var(--text); line-height: 1.5; }

.speaker-row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.8rem; }
.speak-btn-uk, .speak-btn-us {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.35rem 0.9rem; border-radius: 20px; border: 1.5px solid;
  font-family: 'DM Mono', monospace; font-size: 0.7rem; cursor: pointer; background: none; transition: all 0.15s;
}
.speak-btn-uk { border-color: var(--uk); color: var(--uk); }
.speak-btn-uk:hover { background: rgba(44,95,138,0.08); }
.speak-btn-us { border-color: var(--us); color: var(--us); }
.speak-btn-us:hover { background: rgba(192,122,32,0.08); }

.swipe-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
.swipe-overlay.unfav { background: rgba(230,168,23,0.15); color: var(--unfav); }
.swipe-overlay.known { background: rgba(45,122,79,0.12); color: var(--green); }

.card-nav { display: flex; gap: 0.5rem; }
.btn-nav { flex: 1; padding: 0.6rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 0.72rem; cursor: pointer; transition: all 0.15s; color: var(--muted); text-align: center; }
.btn-nav:hover { border-color: var(--accent); color: var(--accent); }
.btn-nav.primary { border-color: var(--accent); color: var(--accent); }
.btn-check { padding: 0.6rem 1.2rem; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; width: 100%; margin-top: 0.5rem; }

.summary-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 2rem; text-align: center; }
.summary-card h2 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
.summary-stats { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; }
.sum-stat .val { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; }
.sum-stat .lbl { font-size: 0.72rem; color: var(--muted); }

/* Overview */
.search-box { width: 100%; padding: 0.6rem 0.9rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem; background: var(--surface); color: var(--text); outline: none; margin-bottom: 0.7rem; }
.search-box:focus { border-color: var(--accent); }

.ov-topic-grid { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.8rem; }
.ov-topic-btn { padding: 0.3rem 0.7rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 0.65rem; cursor: pointer; color: var(--muted); transition: all 0.15s; white-space: nowrap; }
.ov-topic-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

.ov-count { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-bottom: 0.6rem; }

.overview-grid { display: flex; flex-direction: column; gap: 0.45rem; }
.ov-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.8rem; }
.ov-left { flex: 1; min-width: 0; }
.ov-word { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--accent); }
.ov-pos-trans { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
.ov-pos { font-family: 'DM Mono', monospace; color: var(--unfav); font-size: 0.72rem; }
.ov-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; flex-shrink: 0; }
.ov-speakers { display: flex; gap: 0.3rem; }
.ov-spk { background: none; border: 1.5px solid; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; cursor: pointer; transition: all 0.15s; }
.ov-spk.uk { border-color: var(--uk); color: var(--uk); }
.ov-spk.us { border-color: var(--us); color: var(--us); }
.ov-dict { display: inline-flex; align-items: center; font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); text-decoration: none; border: 1.5px solid var(--border); border-radius: 20px; padding: 0.15rem 0.5rem; transition: all 0.15s; }
.ov-dict:hover { border-color: var(--accent2); color: var(--accent2); }
.ov-topic-tag { font-family: 'DM Mono', monospace; font-size: 0.55rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 0.1rem 0.4rem; }

.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.88rem; line-height: 1.8; }
</style>
</head>
<body>

<div class="nav">
  <button class="nav-btn active" onclick="showPage('flashcard', this)">閃卡練習</button>
  <button class="nav-btn" onclick="showPage('unfav', this)">⭐ 不熟單字</button>
  <button class="nav-btn" onclick="showPage('overview', this)">單字總覽</button>
</div>

<!-- FLASHCARD PAGE -->
<div class="page active" id="page-flashcard">
  <div style="padding-top:0.8rem">
    <div class="section-label">選擇主題</div>
    <div class="topic-grid" id="topicGrid"></div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="selectAllTopics()">全選</button>
      <button class="quick-btn" onclick="clearTopics()">清除</button>
    </div>

    <div class="autoplay-row">
      <span class="autoplay-label">自動播放語音</span>
      <div class="accent-toggle">
        <button class="accent-btn uk active" id="accentUK" onclick="setAccent('uk')">🔵 英式</button>
        <button class="accent-btn us" id="accentUS" onclick="setAccent('us')">🟠 美式</button>
      </div>
    </div>

    <div class="kbd-hint">
      <span>⬅ 不熟</span>
      <span>空白鍵 翻面</span>
      <span>➡ 熟練</span>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="val" id="statTotal">0</div><div class="lbl">總字數</div></div>
      <div class="stat-box"><div class="val green" id="statKnown">0</div><div class="lbl">熟練</div></div>
      <div class="stat-box"><div class="val unfav-col" id="statUnfav">0</div><div class="lbl">不熟</div></div>
      <div class="stat-box"><div class="val" id="statIdx">—</div><div class="lbl">進度</div></div>
    </div>

    <div class="swipe-hints">
      <span class="swipe-hint left">← 左滑／← 鍵　不熟⭐</span>
      <span class="swipe-hint right">熟練✓　右滑／→ 鍵 →</span>
    </div>

    <div class="face-dots" id="faceDots">
      <div class="face-dot active"></div>
      <div class="face-dot"></div>
    </div>

    <div class="card-area" id="cardArea">
      <div class="empty-state">請先選擇主題，開始練習 👆</div>
    </div>

    <div class="card-nav" id="cardNav" style="display:none; margin-top:0.8rem">
      <button class="btn-nav" onclick="prevCard()">← 上一張</button>
      <button class="btn-nav primary" onclick="flipCard()">翻面（空白）</button>
      <button class="btn-nav" onclick="nextCardSkip()">跳過 →</button>
    </div>
  </div>
</div>

<!-- UNFAV PAGE -->
<div class="page" id="page-unfav">
  <div style="padding-top:0.8rem">
    <div class="autoplay-row">
      <span class="autoplay-label">⭐ 不熟單字複習</span>
      <div class="accent-toggle">
        <button class="accent-btn uk active" id="unfavAccentUK" onclick="setAccent('uk')">🔵 英式</button>
        <button class="accent-btn us" id="unfavAccentUS" onclick="setAccent('us')">🟠 美式</button>
      </div>
    </div>
    <div class="kbd-hint">
      <span>⬅ 不熟</span><span>空白鍵 翻面</span><span>➡ 移除不熟</span>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="val unfav-col" id="unfavTotal">0</div><div class="lbl">不熟單字</div></div>
      <div class="stat-box"><div class="val green" id="unfavRemoved">0</div><div class="lbl">已移除</div></div>
      <div class="stat-box"><div class="val" id="unfavIdx">—</div><div class="lbl">進度</div></div>
    </div>
    <div class="swipe-hints">
      <span class="swipe-hint left">← 還是不熟</span>
      <span class="swipe-hint right">已熟練，移除 →</span>
    </div>
    <div class="face-dots" id="unfavFaceDots">
      <div class="face-dot active"></div>
      <div class="face-dot"></div>
    </div>
    <div class="card-area" id="unfavCardArea">
      <div class="empty-state">還沒有不熟單字 🎉<br><span style="font-size:0.78rem">在閃卡練習中左滑可以加入</span></div>
    </div>
    <div class="card-nav" id="unfavCardNav" style="display:none; margin-top:0.8rem">
      <button class="btn-nav" onclick="unfavPrev()">← 上一張</button>
      <button class="btn-nav primary" onclick="unfavFlip()">翻面（空白）</button>
      <button class="btn-nav" onclick="unfavSkip()">跳過 →</button>
    </div>
  </div>
</div>

<!-- OVERVIEW PAGE -->
<div class="page" id="page-overview">
  <div style="padding-top:0.8rem">
    <input class="search-box" id="searchBox" placeholder="搜尋英文或中文…" oninput="renderOverview()">
    <div class="section-label">主題篩選（可複選）</div>
    <div class="ov-topic-grid" id="ovTopicGrid"></div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="ovSelectAll()">全選</button>
      <button class="quick-btn" onclick="ovClearAll()">清除</button>
    </div>
    <div class="ov-count" id="ovCount"></div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>
</div>

// ── STATE ──
const topicNames = Object.keys(topics);
let selectedTopics = new Set();
let cardList = [];
let cardIdx = 0;
let face = 0;
let autoAccent = 'uk';
let knownCount = 0;
let unfavCount = 0;
let ovSelectedTopics = new Set(topicNames);

// Persistent unfav list (saved to localStorage)
let unfavList = JSON.parse(localStorage.getItem('ielts_vocab_unfav') || '[]');
let unfavIdx = 0;
let unfavFace = 0;
let unfavRemovedCount = 0;

function saveUnfavList() {
  localStorage.setItem('ielts_vocab_unfav', JSON.stringify(unfavList));
}

// ── BUILD GRIDS ──
const tGrid = document.getElementById('topicGrid');
topicNames.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'topic-btn';
  btn.textContent = t;
  btn.id = 'tbtn-' + t;
  btn.onclick = () => toggleTopic(t);
  tGrid.appendChild(btn);
});

const ovGrid = document.getElementById('ovTopicGrid');
topicNames.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'ov-topic-btn active';
  btn.textContent = t;
  btn.id = 'ovbtn-' + t;
  btn.onclick = () => ovToggleTopic(t);
  ovGrid.appendChild(btn);
});

function toggleTopic(t) {
  if (selectedTopics.has(t)) { selectedTopics.delete(t); document.getElementById('tbtn-' + t).classList.remove('active'); }
  else { selectedTopics.add(t); document.getElementById('tbtn-' + t).classList.add('active'); }
  buildCardList();
}
function selectAllTopics() { topicNames.forEach(t => { selectedTopics.add(t); document.getElementById('tbtn-' + t).classList.add('active'); }); buildCardList(); }
function clearTopics() { selectedTopics.clear(); topicNames.forEach(t => document.getElementById('tbtn-' + t).classList.remove('active')); buildCardList(); }

function ovToggleTopic(t) {
  if (ovSelectedTopics.has(t)) { ovSelectedTopics.delete(t); document.getElementById('ovbtn-' + t).classList.remove('active'); }
  else { ovSelectedTopics.add(t); document.getElementById('ovbtn-' + t).classList.add('active'); }
  renderOverview();
}
function ovSelectAll() { topicNames.forEach(t => { ovSelectedTopics.add(t); document.getElementById('ovbtn-' + t).classList.add('active'); }); renderOverview(); }
function ovClearAll() { ovSelectedTopics.clear(); topicNames.forEach(t => document.getElementById('ovbtn-' + t).classList.remove('active')); renderOverview(); }

function setAccent(a) {
  autoAccent = a;
  document.getElementById('accentUK').classList.toggle('active', a === 'uk');
  document.getElementById('accentUS').classList.toggle('active', a === 'us');
}

function buildCardList() {
  cardList = [];
  topicNames.forEach(t => { if (selectedTopics.has(t)) cardList = cardList.concat(topics[t].map(item => ({ ...item, topic: t }))); });
  cardIdx = 0; face = 0; knownCount = 0; unfavCount = 0;
  updateStats(); renderCard();
  document.getElementById('cardNav').style.display = cardList.length ? 'flex' : 'none';
}

function updateStats() {
  document.getElementById('statTotal').textContent = cardList.length;
  document.getElementById('statKnown').textContent = knownCount;
  document.getElementById('statUnfav').textContent = unfavCount;
  document.getElementById('statIdx').textContent = cardList.length ? (cardIdx + 1) + '/' + cardList.length : '—';
  const dots = document.querySelectorAll('.face-dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === face));
}

function speak(text, accent, rate = 0.85) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = accent === 'uk' ? 'en-GB' : 'en-US';
  u.rate = rate;
  speechSynthesis.speak(u);
}

function renderCard() {
  const area = document.getElementById('cardArea');
  if (cardList.length === 0) { area.innerHTML = '<div class="empty-state">請先選擇主題，開始練習 👆</div>'; return; }
  if (cardIdx >= cardList.length) { renderSummary(); return; }
  const item = cardList[cardIdx];
  updateStats();

  if (face === 0) {
    area.innerHTML = `
      <div class="flashcard" id="mainCard">
        <div class="face-badge">英文單字</div>
        <div class="progress-badge">${cardIdx+1} / ${cardList.length}</div>
        <div class="topic-badge">${item.topic}</div>
        <div class="word-main">${item.w}</div>
        <div class="speaker-row">
          <button class="speak-btn-uk" onclick="speak('${item.w.replace(/'/g,"\\'")}','uk');event.stopPropagation()">🔵 英式</button>
          <button class="speak-btn-us" onclick="speak('${item.w.replace(/'/g,"\\'")}','us');event.stopPropagation()">🟠 美式</button>
        </div>
        <div class="swipe-overlay unfav" id="overlayUnfav">⭐ 不熟</div>
        <div class="swipe-overlay known" id="overlayKnown">✓ 熟練</div>
      </div>`;
    setTimeout(() => speak(item.w, autoAccent), 300);
  } else {
    area.innerHTML = `
      <div class="flashcard" id="mainCard">
        <div class="face-badge">中文翻譯</div>
        <div class="progress-badge">${cardIdx+1} / ${cardList.length}</div>
        <div class="topic-badge">${item.topic}</div>
        <div class="word-pos">${item.pos}</div>
        <div class="word-trans">${item.t}</div>
        <div class="speaker-row" style="margin-top:1rem">
          <button class="speak-btn-uk" onclick="speak('${item.w.replace(/'/g,"\\'")}','uk');event.stopPropagation()">🔵 ${item.w}</button>
        </div>
        <div class="swipe-overlay unfav" id="overlayUnfav">⭐ 不熟</div>
        <div class="swipe-overlay known" id="overlayKnown">✓ 熟練</div>
      </div>`;
  }
  setupSwipe();
}

function flipCard() { face = face === 0 ? 1 : 0; renderCard(); }
function nextCard() { face = 0; cardIdx++; renderCard(); }
function prevCard() { if (cardIdx > 0) { face = 0; cardIdx--; renderCard(); } }
function markUnfav() {
  unfavCount++;
  const item = cardList[cardIdx];
  if (item && !unfavList.find(u => u.w === item.w)) {
    unfavList.push(item);
    saveUnfavList();
  }
  face = 0; cardIdx++; updateStats(); renderCard();
}
function markKnown() { knownCount++; face = 0; cardIdx++; updateStats(); renderCard(); }
function nextCardSkip() { face = 0; cardIdx++; updateStats(); renderCard(); }

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (document.getElementById('page-flashcard').classList.contains('active')) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); markUnfav(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); markKnown(); }
    else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  }
  if (document.getElementById('page-unfav').classList.contains('active')) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); unfavKeepAndNext(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); unfavRemoveAndNext(); }
    else if (e.key === ' ') { e.preventDefault(); unfavFlip(); }
  }
});

        </div>
        <div class="swipe-overlay unfav" id="uOverlayUnfav">⭐ 還不熟</div>
        <div class="swipe-overlay known" id="uOverlayKnown">✓ 移除</div>
      </div>`;
    setTimeout(() => speak(item.w, autoAccent), 300);
  } else {
    area.innerHTML = `
      <div class="flashcard" id="unfavMainCard">
        <div class="face-badge">中文翻譯</div>
        <div class="progress-badge">${unfavIdx+1} / ${unfavList.length}</div>
        <div class="topic-badge">${item.topic || ''}</div>
        <div class="word-pos">${item.pos || ''}</div>
        <div class="word-trans">${item.t}</div>
        <div class="speaker-row" style="margin-top:1rem">
          <button class="speak-btn-uk" onclick="speak('${item.w.replace(/'/g,"\\'")}','uk');event.stopPropagation()">🔵 ${item.w}</button>
        </div>
        <div class="swipe-overlay unfav" id="uOverlayUnfav">⭐ 還不熟</div>
        <div class="swipe-overlay known" id="uOverlayKnown">✓ 移除</div>
      </div>`;
  }
  setupUnfavSwipe();
}

function unfavFlip() { unfavFace = unfavFace === 0 ? 1 : 0; renderUnfavCard(); }
function unfavSkip() { unfavFace = 0; unfavIdx = (unfavIdx + 1) % unfavList.length; renderUnfavCard(); }
function unfavPrev() { unfavFace = 0; unfavIdx = unfavIdx > 0 ? unfavIdx - 1 : unfavList.length - 1; renderUnfavCard(); }

function unfavKeepAndNext() {
  unfavFace = 0;
  unfavIdx = (unfavIdx + 1) % unfavList.length;
  renderUnfavCard();
}

function unfavRemoveAndNext() {
  unfavList.splice(unfavIdx, 1);
  saveUnfavList();
  unfavRemovedCount++;
  unfavFace = 0;
  if (unfavList.length === 0) { unfavIdx = 0; }
  else if (unfavIdx >= unfavList.length) { unfavIdx = 0; }
  renderUnfavCard();
}

function setupUnfavSwipe() {
  const card = document.getElementById('unfavMainCard');
  if (!card) return;
  let startX = 0, dx = 0, dragging = false;

  function onStart(x) { startX = x; dragging = true; card.classList.add('swiping'); }
  function onMove(x) {
    if (!dragging) return;
    dx = x - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx * 0.04}deg)`;
    const pct = Math.min(Math.abs(dx) / 80, 1);
    const ou = document.getElementById('uOverlayUnfav');
    const ok = document.getElementById('uOverlayKnown');
    if (ou) ou.style.opacity = dx < -20 ? pct : 0;
    if (ok) ok.style.opacity = dx > 20 ? pct : 0;
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('swiping');
    if (dx < -60) { card.classList.add('swipe-left'); setTimeout(() => unfavKeepAndNext(), 180); }
    else if (dx > 60) { card.classList.add('swipe-right'); setTimeout(() => unfavRemoveAndNext(), 180); }
    else {
      card.style.transform = '';
      const ou = document.getElementById('uOverlayUnfav');
      const ok = document.getElementById('uOverlayKnown');
      if (ou) ou.style.opacity = 0;
      if (ok) ok.style.opacity = 0;
      if (Math.abs(dx) < 8) unfavFlip();
    }
    dx = 0;
  }

  card.addEventListener('mousedown', e => onStart(e.clientX));
  window.addEventListener('mousemove', e => { if (dragging) onMove(e.clientX); });
  window.addEventListener('mouseup', () => { if (dragging) onEnd(); });
  card.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
  card.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
  card.addEventListener('touchend', () => onEnd());
}

// ── SWIPE ──
function setupSwipe() {
  const card = document.getElementById('mainCard');
  if (!card) return;
  let startX = 0, dx = 0, dragging = false;

  function onStart(x) { startX = x; dragging = true; card.classList.add('swiping'); }
  function onMove(x) {
    if (!dragging) return;
    dx = x - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx * 0.04}deg)`;
    const pct = Math.min(Math.abs(dx) / 80, 1);
    const ou = document.getElementById('overlayUnfav');
    const ok = document.getElementById('overlayKnown');
    if (ou) ou.style.opacity = dx < -20 ? pct : 0;
    if (ok) ok.style.opacity = dx > 20 ? pct : 0;
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('swiping');
    if (dx < -60) { card.classList.add('swipe-left'); setTimeout(() => markUnfav(), 180); }
    else if (dx > 60) { card.classList.add('swipe-right'); setTimeout(() => markKnown(), 180); }
    else {
      card.style.transform = '';
      const ou = document.getElementById('overlayUnfav');
      const ok = document.getElementById('overlayKnown');
      if (ou) ou.style.opacity = 0;
      if (ok) ok.style.opacity = 0;
      if (Math.abs(dx) < 8) flipCard();
    }
    dx = 0;
  }

  card.addEventListener('mousedown', e => { onStart(e.clientX); });
  window.addEventListener('mousemove', e => { if (dragging) onMove(e.clientX); });
  window.addEventListener('mouseup', () => { if (dragging) onEnd(); });
  card.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
  card.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
  card.addEventListener('touchend', () => onEnd());
}

function renderSummary() {
  const total = knownCount + unfavCount;
  const rate = total > 0 ? Math.round(knownCount / total * 100) : 0;
  document.getElementById('cardArea').innerHTML = `
    <div class="summary-card">
      <h2>完成！🎉</h2>
      <div class="summary-stats">
        <div class="sum-stat"><div class="val green">${knownCount}</div><div class="lbl">熟練</div></div>
        <div class="sum-stat"><div class="val unfav-col">${unfavCount}</div><div class="lbl">不熟</div></div>
        <div class="sum-stat"><div class="val">${rate}%</div><div class="lbl">熟練率</div></div>
      </div>
      <button class="btn-check" onclick="buildCardList()">再來一輪</button>
    </div>`;
}

// ── OVERVIEW ──
function renderOverview() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const grid = document.getElementById('overviewGrid');
  let items = [];
  topicNames.forEach(t => {
    if (!ovSelectedTopics.has(t)) return;
    topics[t].forEach(item => {
      if (!q || item.w.toLowerCase().includes(q) || item.t.includes(q) || item.pos.includes(q)) {
        items.push({ ...item, topic: t });
      }
    });
  });
  document.getElementById('ovCount').textContent = `共 ${items.length} 個單字`;
  if (items.length === 0) { grid.innerHTML = '<div class="empty-state">找不到符合的單字</div>'; return; }
  grid.innerHTML = items.map(item => `
    <div class="ov-card">
      <div class="ov-left">
        <div class="ov-word">${item.w}</div>
        <div class="ov-pos-trans"><span class="ov-pos">${item.pos}</span> ${item.t}</div>
      </div>
      <div class="ov-right">
        <div class="ov-speakers">
          <button class="ov-spk uk" onclick="speak('${item.w.replace(/'/g,"\\'")}','uk')" title="英式">🔵</button>
          <button class="ov-spk us" onclick="speak('${item.w.replace(/'/g,"\\'")}','us')" title="美式">🟠</button>
        </div>
        <div style="display:flex;gap:0.3rem;align-items:center">
          <a class="ov-dict" href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(item.w.toLowerCase().replace(/\s+/g,'-'))}" target="_blank">劍橋</a>
          <span class="ov-topic-tag">${item.topic.split(' ')[0]}</span>
        </div>
      </div>
    </div>`).join('');
}

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'overview') renderOverview();
  if (id === 'unfav') renderUnfavPage();
}

renderOverview();
</script>
