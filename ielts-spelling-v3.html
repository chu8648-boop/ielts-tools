<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思拼寫練習 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+TC:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --surface: #fffdf7;
  --border: #d8cfc0;
  --accent: #c0392b;
  --accent2: #2c5f8a;
  --text: #1a1a1a;
  --muted: #7a7060;
  --green: #2d7a4f;
  --red: #c0392b;
  --yellow: #e6a817;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding: 1.5rem 1rem 4rem; }

header { text-align: center; margin-bottom: 1.5rem; }
header h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.9rem; color: var(--accent); letter-spacing: -0.02em; }
header p { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; }

.container { max-width: 680px; margin: 0 auto; }

.section-label { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }

/* Letter grid */
.letter-grid { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.7rem; }
.letter-btn {
  width: 38px; height: 38px; border: 1.5px solid var(--border); background: var(--surface);
  border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.82rem;
  cursor: pointer; transition: all 0.15s; color: var(--text); position: relative;
}
.letter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
.letter-btn.active::after { content: '✔'; position: absolute; top: -5px; right: -5px; font-size: 0.55rem; background: var(--green); color: white; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; line-height: 14px; }

.selection-display { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--accent2); margin-bottom: 0.8rem; min-height: 1.2rem; }

.quick-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.quick-btn { padding: 0.35rem 0.8rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 0.7rem; cursor: pointer; transition: all 0.15s; color: var(--muted); }
.quick-btn:hover { border-color: var(--accent2); color: var(--accent2); }

/* Settings row */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1.2rem; }
.setting-box { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 0.7rem 0.9rem; }
.setting-box .setting-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
.setting-box select { width: 100%; border: none; background: transparent; font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--text); outline: none; cursor: pointer; }

/* Mode buttons */
.mode-row { display: flex; gap: 0.4rem; margin-bottom: 1.2rem; }
.mode-btn { flex: 1; padding: 0.55rem 0.4rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 0.68rem; cursor: pointer; transition: all 0.15s; color: var(--muted); text-align: center; letter-spacing: 0.02em; }
.mode-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(44,95,138,0.06); }

/* Stats bar */
.stats-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.stat-box { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 0.6rem 0.4rem; text-align: center; }
.stat-box .val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.2rem; }
.stat-box .lbl { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.val.green { color: var(--green); }
.val.red { color: var(--red); }
.val.yellow { color: var(--yellow); }

/* Card */
.card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 1.8rem 1.5rem; margin-bottom: 0.8rem; text-align: center; position: relative; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.progress-badge { position: absolute; top: 0.9rem; right: 1rem; font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); }
.unfav-btn { position: absolute; top: 0.8rem; left: 1rem; background: none; border: 1.5px solid var(--border); border-radius: 20px; padding: 0.2rem 0.6rem; font-size: 0.7rem; cursor: pointer; color: var(--muted); font-family: 'DM Mono', monospace; transition: all 0.15s; }
.unfav-btn.marked { border-color: var(--yellow); color: var(--yellow); }

.word-hint-line { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
.word-hint-line strong { color: var(--accent2); }

.speak-btn { display: inline-flex; align-items: center; gap: 0.4rem; background: none; border: 1.5px solid var(--border); border-radius: 20px; padding: 0.4rem 1rem; font-size: 0.8rem; cursor: pointer; color: var(--muted); font-family: 'DM Mono', monospace; transition: all 0.15s; margin-bottom: 0.8rem; }
.speak-btn:hover { border-color: var(--accent); color: var(--accent); }

.translation-area { margin-bottom: 0.6rem; }
.show-trans-btn { background: none; border: 1.5px solid var(--border); border-radius: 20px; padding: 0.3rem 0.8rem; font-size: 0.72rem; cursor: pointer; color: var(--muted); font-family: 'DM Mono', monospace; transition: all 0.15s; }
.show-trans-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.translation-text { font-size: 0.88rem; color: var(--accent2); margin-top: 0.4rem; font-weight: 500; }

/* Input */
.input-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
.spell-input { flex: 1; padding: 0.75rem 1rem; border: 2px solid var(--border); border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 1.05rem; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; letter-spacing: 0.06em; }
.spell-input:focus { border-color: var(--accent2); }
.spell-input.correct { border-color: var(--green); background: rgba(45,122,79,0.05); }
.spell-input.wrong { border-color: var(--red); background: rgba(192,57,43,0.05); }
.btn-check { padding: 0.75rem 1.1rem; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
.btn-check:hover { opacity: 0.85; }

/* Feedback */
.feedback { text-align: center; font-family: 'DM Mono', monospace; font-size: 0.88rem; min-height: 1.3rem; margin-bottom: 0.6rem; }
.feedback.correct { color: var(--green); }
.feedback.wrong { color: var(--red); }

/* Result card (after answer) */
.result-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 1.2rem 1.4rem; margin-bottom: 0.8rem; text-align: left; }
.result-word { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; margin-bottom: 0.3rem; }
.result-word.green { color: var(--green); }
.result-word.red { color: var(--red); }
.result-trans { font-size: 0.88rem; color: var(--accent2); margin-bottom: 0.8rem; font-weight: 500; }
.result-example { font-size: 0.85rem; color: var(--text); line-height: 1.6; margin-bottom: 0.5rem; font-style: italic; }
.error-comparison { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--red); margin-bottom: 0.6rem; }
.expand-btn { background: none; border: 1.5px solid var(--border); border-radius: 20px; padding: 0.3rem 0.8rem; font-size: 0.7rem; cursor: pointer; color: var(--muted); font-family: 'DM Mono', monospace; transition: all 0.15s; margin-right: 0.4rem; }
.expand-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.root-content { font-size: 0.82rem; color: var(--muted); line-height: 1.6; margin-top: 0.6rem; padding: 0.7rem; background: var(--bg); border-radius: 8px; display: none; }
.root-content.open { display: block; }

/* Nav */
.nav-row { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
.btn-nav { flex: 1; padding: 0.6rem 0.4rem; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 0.72rem; cursor: pointer; transition: all 0.15s; color: var(--muted); text-align: center; }
.btn-nav:hover { border-color: var(--text); color: var(--text); }
.btn-nav.primary { border-color: var(--accent2); color: var(--accent2); }
.btn-nav.danger { border-color: var(--accent); color: var(--accent); }

/* Summary */
.summary-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 2rem; text-align: center; }
.summary-card h2 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
.summary-stats { display: flex; gap: 1rem; justify-content: center; margin: 1.2rem 0; }
.summary-stat .val { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; }
.summary-stat .lbl { font-size: 0.75rem; color: var(--muted); }
.summary-btns { display: flex; flex-direction: column; gap: 0.5rem; }

/* Unfav filter notice */
.filter-notice { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--yellow); text-align: center; margin-bottom: 0.6rem; }

.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>雅思拼寫練習</h1>
  <p>聽力填空單字練習</p>
</header>

<div class="container">

  <div class="section-label">選擇字母</div>
  <div class="letter-grid" id="letterGrid"></div>
  <div class="selection-display" id="selectionDisplay">目前選擇：尚未選擇</div>

  <div class="quick-btns">
    <button class="quick-btn" onclick="selectRange('A','E')">A–E</button>
    <button class="quick-btn" onclick="selectRange('A','J')">A–J</button>
    <button class="quick-btn" onclick="selectRange('A','P')">A–P</button>
    <button class="quick-btn" onclick="selectAll()">全部 A–Y</button>
    <button class="quick-btn" onclick="clearAll()">清除</button>
  </div>

  <div class="settings-grid">
    <div class="setting-box">
      <div class="setting-label">題目數量</div>
      <select id="countSelect" onchange="buildList()">
        <option value="10">10 題</option>
        <option value="20">20 題</option>
        <option value="999" selected>全部</option>
      </select>
    </div>
    <div class="setting-box">
      <div class="setting-label">順序</div>
      <select id="shuffleSelect" onchange="buildList()">
        <option value="order">照順序</option>
        <option value="random">隨機</option>
      </select>
    </div>
  </div>

  <div class="section-label">練習模式</div>
  <div class="mode-row">
    <button class="mode-btn active" id="modeExam" onclick="setMode('exam')">🎯 考試模式</button>
    <button class="mode-btn" id="modeLearn" onclick="setMode('learn')">📖 學習模式</button>
    <button class="mode-btn" id="modeUnfav" onclick="setMode('unfav')">⭐ 不熟單字</button>
  </div>

  <div class="stats-bar">
    <div class="stat-box"><div class="val" id="statTotal">0</div><div class="lbl">總字數</div></div>
    <div class="stat-box"><div class="val green" id="statCorrect">0</div><div class="lbl">答對</div></div>
    <div class="stat-box"><div class="val red" id="statWrong">0</div><div class="lbl">答錯</div></div>
    <div class="stat-box"><div class="val yellow" id="statRate">—</div><div class="lbl">正確率</div></div>
  </div>

  <div id="mainArea">
    <div class="empty-state">請先選擇字母，開始練習 👆<br><span style="font-size:0.78rem">可以單選 A，或快速選 A–E、全部</span></div>
  </div>

</div>

  "Transport": { ex: "Public transport is cheaper than taxis.", root: "trans-（跨越）+ portare（攜帶）→ 跨越攜帶" },
  "University": { ex: "She applied to three universities.", root: "universus（全體）→ 全體知識的地方" },
  "Vocabulary": { ex: "Building vocabulary is key to IELTS success.", root: "voca（聲音/字）+ -ary → 字的集合" }
};

function getExtra(word) {
  return extras[word] || { ex: "This word often appears in IELTS listening and reading.", root: "（暫無字根資料）" };
}

// ── State ──
const letters = Object.keys(wordData);
let selectedLetters = new Set();
let currentList = [];
let currentIdx = 0;
let mode = 'exam';
let stats = { correct: 0, wrong: 0 };
let answered = false;
let unfavSet = new Set(JSON.parse(localStorage.getItem('ielts_unfav') || '[]'));
let wrongList = [];
let showTranslation = false;

// Build letter grid
const grid = document.getElementById('letterGrid');
letters.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'letter-btn';
  btn.textContent = l;
  btn.id = 'lbtn-' + l;
  btn.onclick = () => toggleLetter(l);
  grid.appendChild(btn);
});

function toggleLetter(l) {
  if (selectedLetters.has(l)) { selectedLetters.delete(l); document.getElementById('lbtn-' + l).classList.remove('active'); }
  else { selectedLetters.add(l); document.getElementById('lbtn-' + l).classList.add('active'); }
  updateSelectionDisplay();
  buildList();
}

function selectRange(from, to) {
  letters.forEach(l => { if (l >= from && l <= to) { selectedLetters.add(l); document.getElementById('lbtn-' + l).classList.add('active'); } });
  updateSelectionDisplay(); buildList();
}
function selectAll() { letters.forEach(l => { selectedLetters.add(l); document.getElementById('lbtn-' + l).classList.add('active'); }); updateSelectionDisplay(); buildList(); }
function clearAll() { selectedLetters.clear(); letters.forEach(l => document.getElementById('lbtn-' + l).classList.remove('active')); updateSelectionDisplay(); buildList(); }

function updateSelectionDisplay() {
  const sel = [...selectedLetters].sort();
  let txt = '目前選擇：';
  if (sel.length === 0) txt += '尚未選擇';
  else if (sel.length === letters.length) txt += 'A–Y（全部）';
  else if (sel.length === 1) txt += sel[0];
  else {
    // check if contiguous
    let contiguous = true;
    for (let i = 1; i < sel.length; i++) { if (sel[i].charCodeAt(0) - sel[i-1].charCodeAt(0) !== 1) { contiguous = false; break; } }
    txt += contiguous ? `${sel[0]}–${sel[sel.length-1]}` : sel.join(' + ');
  }
  document.getElementById('selectionDisplay').textContent = txt;
}

function saveUnfav() { localStorage.setItem('ielts_unfav', JSON.stringify([...unfavSet])); }

function buildList(useWrong = false, useUnfav = false) {
  let pool = [];
  if (useWrong) { pool = wrongList.slice(); }
  else if (useUnfav || mode === 'unfav') {
    letters.forEach(l => { if (selectedLetters.size === 0 || selectedLetters.has(l)) pool = pool.concat(wordData[l].filter(item => unfavSet.has(item.w))); });
    if (pool.length === 0 && mode === 'unfav') { document.getElementById('mainArea').innerHTML = '<div class="empty-state">⭐ 你還沒有標記不熟的單字<br><span style="font-size:0.78rem">練習時按「不熟」來標記</span></div>'; return; }
  } else {
    letters.forEach(l => { if (selectedLetters.has(l)) pool = pool.concat(wordData[l]); });
  }

  const shuffle = document.getElementById('shuffleSelect').value === 'random';
  if (shuffle) pool = pool.sort(() => Math.random() - 0.5);

  const count = parseInt(document.getElementById('countSelect').value);
  currentList = pool.slice(0, count);
  currentIdx = 0;
  stats = { correct: 0, wrong: 0 };
  wrongList = [];
  answered = false;
  showTranslation = false;
  updateStats();
  render();
}

function setMode(m) {
  mode = m;
  ['modeExam','modeLearn','modeUnfav'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
  buildList();
}

function updateStats() {
  const total = currentList.length;
  const correct = stats.correct;
  const wrong = stats.wrong;
  const answered_count = correct + wrong;
  const rate = answered_count > 0 ? Math.round((correct / answered_count) * 100) + '%' : '—';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = rate;
}

function speak(text, lang = 'en-GB', rate = 0.85) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate;
    speechSynthesis.speak(u);
  }
}

function toggleUnfav(word) {
  if (unfavSet.has(word)) { unfavSet.delete(word); document.getElementById('unfavBtn').classList.remove('marked'); document.getElementById('unfavBtn').textContent = '☆ 不熟'; }
  else { unfavSet.add(word); document.getElementById('unfavBtn').classList.add('marked'); document.getElementById('unfavBtn').textContent = '★ 已標記'; }
  saveUnfav();
}

function render() {
  const area = document.getElementById('mainArea');
  if (currentList.length === 0 && mode !== 'unfav') {
    area.innerHTML = '<div class="empty-state">請先選擇字母，開始練習 👆<br><span style="font-size:0.78rem">可以單選 A，或快速選 A–E、全部</span></div>';
    return;
  }
  if (currentIdx >= currentList.length) { renderSummary(); return; }

  const item = currentList[currentIdx];
  const word = item.w; const trans = item.t;
  const isUnfav = unfavSet.has(word);
  const extra = getExtra(word);
  updateStats();

  if (mode === 'exam') {
    area.innerHTML = `
      <div class="card">
        <div class="progress-badge">${currentIdx+1} / ${currentList.length}</div>
        <button class="unfav-btn ${isUnfav ? 'marked' : ''}" id="unfavBtn" onclick="toggleUnfav('${word.replace(/'/g,"\\'")}')">
          ${isUnfav ? '★ 已標記' : '☆ 不熟'}
        </button>
        <div class="word-hint-line">你正在練：<strong>${word[0].toUpperCase()}</strong></div>
        <button class="speak-btn" onclick="speak('${word.replace(/'/g,"\\'")}')">🔊 重聽</button>
      </div>
      <div class="input-row">
        <input class="spell-input" id="spellInput" type="text" placeholder="打出拼寫…" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn-check" onclick="checkAnswer()">確認</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row" id="navRow">
        <button class="btn-nav" onclick="prevWord()">← 上一個</button>
        <button class="btn-nav" onclick="skipWord()">跳過</button>
        <button class="btn-nav primary" id="nextBtn" style="display:none" onclick="nextWord()">下一個 →</button>
      </div>`;
    setTimeout(() => { speak(word); const inp = document.getElementById('spellInput'); if (inp) inp.focus(); }, 300);
  } else {
    // learn mode
    area.innerHTML = `
      <div class="card">
        <div class="progress-badge">${currentIdx+1} / ${currentList.length}</div>
        <button class="unfav-btn ${isUnfav ? 'marked' : ''}" id="unfavBtn" onclick="toggleUnfav('${word.replace(/'/g,"\\'")}')">
          ${isUnfav ? '★ 已標記' : '☆ 不熟'}
        </button>
        <div class="word-hint-line">你正在練：<strong>${word[0].toUpperCase()}</strong></div>
        <button class="speak-btn" onclick="speak('${word.replace(/'/g,"\\'")}')">🔊 重聽</button>
        <div class="translation-area">
          <button class="show-trans-btn" id="transBtn" onclick="toggleTrans('${trans.replace(/'/g,"\\'")}')">👁 顯示翻譯</button>
          <div class="translation-text" id="transText" style="display:none">${trans}</div>
        </div>
      </div>
      <div class="input-row">
        <input class="spell-input" id="spellInput" type="text" placeholder="打出拼寫…" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn-check" onclick="checkAnswer()">確認</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="resultArea"></div>
      <div class="nav-row" id="navRow">
        <button class="btn-nav" onclick="prevWord()">← 上一個</button>
        <button class="btn-nav" onclick="skipWord()">跳過</button>
        <button class="btn-nav primary" id="nextBtn" style="display:none" onclick="nextWord()">下一個 →</button>
      </div>`;
    setTimeout(() => { speak(word); const inp = document.getElementById('spellInput'); if (inp) inp.focus(); }, 300);
  }
}

function toggleTrans(trans) {
  const btn = document.getElementById('transBtn');
  const txt = document.getElementById('transText');
  if (!txt) return;
  if (txt.style.display === 'none') { txt.style.display = 'block'; btn.textContent = '👁 隱藏翻譯'; }
  else { txt.style.display = 'none'; btn.textContent = '👁 顯示翻譯'; }
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('spellInput');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  if (!input) return;

  const userVal = input.value.trim();
  const item = currentList[currentIdx];
  const word = item.w; const trans = item.t;
  const correct = userVal.toLowerCase() === word.toLowerCase();
  const extra = getExtra(word);
  answered = true;

  if (correct) {
    input.classList.add('correct');
    feedback.textContent = '✓ 正確！';
    feedback.className = 'feedback correct';
    stats.correct++;
    speak(word);
    if (mode === 'learn') {
      document.getElementById('resultArea').innerHTML = `
        <div class="result-card">
          <div class="result-word green">${word}</div>
          <div class="result-trans">${trans}</div>
          <div class="result-example">"${extra.ex}"</div>
          <button class="speak-btn" style="margin-top:0.4rem;font-size:0.72rem" onclick="speak('${extra.ex.replace(/'/g,"\\'")}', 'en-GB', 0.8)">🔊 聽例句</button>
          <div style="margin-top:0.6rem">
            <button class="expand-btn" onclick="toggleRoot()">展開字根</button>
          </div>
          <div class="root-content" id="rootContent">${extra.root}</div>
        </div>`;
    }
  } else {
    input.classList.add('wrong');
    feedback.className = 'feedback wrong';
    stats.wrong++;
    wrongList.push(item);
    speak(word);
    if (mode === 'learn') {
      document.getElementById('resultArea').innerHTML = `
        <div class="result-card">
          <div class="result-word red">${word}</div>
          <div class="result-trans">${trans}</div>
          <div class="error-comparison">你打的：${userVal || '（空白）'}</div>
          <div class="result-example">"${extra.ex}"</div>
          <button class="speak-btn" style="margin-top:0.4rem;font-size:0.72rem" onclick="speak('${extra.ex.replace(/'/g,"\\'")}', 'en-GB', 0.8)">🔊 聽例句</button>
          <div style="margin-top:0.6rem">
            <button class="expand-btn" onclick="toggleRoot()">展開字根</button>
            <button class="expand-btn danger" onclick="retryWord()" style="border-color:var(--red);color:var(--red)">再試一次</button>
          </div>
          <div class="root-content" id="rootContent">${extra.root}</div>
        </div>`;
    } else {
      feedback.innerHTML = `✗ 正確答案：<strong>${word}</strong>　你打的：${userVal || '（空白）'}`;
    }
  }

  if (nextBtn) nextBtn.style.display = '';
  updateStats();
}

function toggleRoot() {
  const rc = document.getElementById('rootContent');
  if (rc) rc.classList.toggle('open');
}

function retryWord() {
  answered = false;
  stats.wrong = Math.max(0, stats.wrong - 1);
  wrongList.pop();
  render();
}

function nextWord() { currentIdx++; answered = false; render(); }
function prevWord() { if (currentIdx > 0) { currentIdx--; answered = false; render(); } }
function skipWord() { stats.wrong++; wrongList.push(currentList[currentIdx]); currentIdx++; answered = false; updateStats(); render(); }

function renderSummary() {
  const total = stats.correct + stats.wrong;
  const rate = total > 0 ? Math.round((stats.correct / total) * 100) : 0;
  const wrongCount = wrongList.length;
  document.getElementById('mainArea').innerHTML = `
    <div class="summary-card">
      <h2>🎉 完成！</h2>
      <div class="summary-stats">
        <div class="summary-stat"><div class="val green">${stats.correct}</div><div class="lbl">答對</div></div>
        <div class="summary-stat"><div class="val red">${stats.wrong}</div><div class="lbl">答錯</div></div>
        <div class="summary-stat"><div class="val">${rate}%</div><div class="lbl">正確率</div></div>
      </div>
      ${wrongCount > 0 ? `<p style="font-size:0.82rem;color:var(--muted);margin-bottom:1rem;font-family:'DM Mono',monospace">有 ${wrongCount} 個單字答錯</p>` : '<p style="font-size:0.82rem;color:var(--green);margin-bottom:1rem">全部答對！太棒了 🌟</p>'}
      <div class="summary-btns">
        ${wrongCount > 0 ? `<button class="btn-check" onclick="buildList(true)">只練錯的 ${wrongCount} 個</button>` : ''}
        <button class="btn-nav primary" style="padding:0.7rem" onclick="buildList()">再來一輪</button>
      </div>
    </div>`;
}
</script>
</body>
</html>
